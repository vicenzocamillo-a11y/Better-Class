<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Better Class</title>
<meta name="description" content="Acesse sua conta do Better Class.">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth">

<main class="auth-shell">
  <a class="brand auth-brand" href="/">
    <img src="/assets/logo.svg" alt="" width="26" height="26">
    <span>Better Class</span>
  </a>

  <section class="auth-box">
    <div class="auth-switch" role="tablist" aria-label="Entrar ou criar conta">
      <button class="auth-switch-btn is-on" data-tab="login" role="tab" aria-selected="true">Entrar</button>
      <button class="auth-switch-btn" data-tab="register" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <p class="auth-intro" id="intro">Entre para ver suas aulas e a fila de revisão de hoje.</p>

    <button class="btn-google" id="googleBtn" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.17 6.66 3.58 9 3.58Z"/>
      </svg>
      <span id="googleLabel">Continuar com o Google</span>
    </button>

    <p class="auth-or" id="divider" hidden><span>ou</span></p>

    <form class="auth-form" id="form" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="name">Nome</label>
        <input class="input" id="name" name="name" autocomplete="name" placeholder="Como você quer ser chamado">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="voce@universidade.br" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="pelo menos 8 caracteres" required>
      </div>

      <p class="auth-error" id="error" role="alert" hidden></p>

      <button class="btn btn-primary btn-lg" type="submit" id="submit">
        <span class="txt">Entrar</span>
      </button>
    </form>
  </section>

  <p class="micro auth-foot">
    <a href="/">Voltar para a página inicial</a>
  </p>
</main>

<div class="toasts" id="toasts"></div>
<script type="module" src="/js/auth-page.js"></script>
</body>
</html>
