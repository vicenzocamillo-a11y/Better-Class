<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Better Class</title>
<meta name="description" content="Suas aulas gravadas e o material de estudo gerado.">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-page">

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/">
      <img src="/assets/logo.svg" alt="" width="24" height="24">
      <span>Better Class</span>
    </a>

    <nav class="side-nav" aria-label="Seções">
      <a href="#/inicio" data-nav="inicio">Início</a>
      <a href="#/gravar" data-nav="gravar">Gravar aula</a>
      <a href="#/aulas" data-nav="aulas">Minhas aulas</a>
      <a href="#/revisar" data-nav="revisar">Revisar<em class="side-badge" id="dueBadge" hidden>0</em></a>
      <a href="#/quiz" data-nav="quiz">Quiz</a>
      <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
    </nav>

    <div class="side-foot">
      <div class="rec-mini" id="recMini" hidden>
        <span class="rec-dot is-live"></span>
        <span class="mono" id="recMiniTime">00:00:00</span>
        <a href="#/gravar">abrir</a>
      </div>
      <div class="user-chip">
        <div class="who">
          <strong id="userName">—</strong>
          <span class="micro" id="engineBadge">motor local</span>
        </div>
        <button class="btn btn-quiet btn-sm" id="logout">Sair</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-outline btn-sm only-mobile" id="menuBtn" aria-label="Abrir menu">Menu</button>
      <div class="topbar-title">
        <h1 class="h2" id="viewTitle">Início</h1>
        <p class="micro" id="viewSub"></p>
      </div>
      <div class="topbar-actions">
        <label class="search">
          <span class="sr-only">Buscar nas aulas</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="6" cy="6" r="4.3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9.4 9.4 12.6 12.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Buscar nas aulas">
        </label>
        <a class="btn btn-primary btn-sm" href="#/gravar">Gravar</a>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="boot" id="boot">
  <img src="/assets/logo.svg" alt="Better Class" width="40" height="40" style="border-radius:9px">
  <p class="micro" id="bootMsg">carregando suas aulas</p>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
